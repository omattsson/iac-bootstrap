# Markdownlint configuration for iac-bootstrap
# Disable rules that conflict with the existing document style in this repo.

default: true

# Line length — tables and code examples legitimately exceed 80 chars
MD013: false

# Blanks around headings — SKILL.md uses tight heading/list layout intentionally
MD022: false

# Blanks around lists — same reason as MD022
MD032: false

# Trailing punctuation in headings — "For Claude Code:" style headings are intentional
MD026: false

# Fenced code blocks should have a language — plain-text blocks are used for
# interview question lists and directory trees
MD040: false

# Duplicate headings — the value-comparison doc repeats subsection names
# (for example "Without Agents", "Time & Quality Summary") under each scenario.
# Allow the repetition across sections; still flag true sibling duplicates.
MD024:
  siblings_only: true

# Emphasis used as a heading — bold "Total: N steps …" summary lines in the
# value-comparison doc are intentional inline summaries, not section headings.
MD036: false
