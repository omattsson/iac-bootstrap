[build-system]
# setuptools>=64 for PEP 660 editable support, which the in-tree backend wraps.
requires = ["setuptools>=64"]
# In-tree backend that regenerates bootstrap_iac/templates/ from the canonical
# references/ before building (when references/ is reachable). See
# cli/_bootstrap_build.py and scripts/build_templates.py.
build-backend = "_bootstrap_build"
backend-path = ["."]

[project]
name = "bootstrap-iac"
version = "0.1.0"
description = "CLI tool for bootstrapping AI agent customizations for Terraform IaC workspaces"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["terraform", "iac", "ai", "copilot", "claude", "bootstrap"]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
bootstrap-iac = "bootstrap_iac.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bootstrap_iac*"]

[tool.setuptools.package-data]
"bootstrap_iac" = ["templates/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "wheel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
